name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: |
          python -m pytest -v

      - name: Run quick reproduction pipeline
        run: |
          python reproduce.py --quick

      - name: Verify generated artifacts
        shell: bash
        run: |
          test -f results/validation.json || (echo "validation.json missing" && exit 1)
          test -f results/metrics.csv || (echo "metrics.csv missing" && exit 1)
          python -c "import json; v = json.load(open('results/validation.json')); assert all(x['passed'] for x in v.values()), 'Validation checks failed'"
