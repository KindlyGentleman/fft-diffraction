mode: "full"
description: "Comprehensive scientific parameter sweep including high-resolution grids and convergence references"

wavelength: 5.32e-7

apertures:
  circular:
    radius: 1.5e-4
  rectangular:
    width: 3.0e-4
    height: 4.5e-4

study1_distances:
  grid:
    nx: 1024
    ny: 1024
    dx: 5.0e-6
    dy: 5.0e-6
    padding: 2
  distances: [0.001, 0.002, 0.005, 0.010, 0.020, 0.050, 0.100, 0.200, 0.300, 0.500, 0.800]

study2_sampling:
  fixed_fov:
    fov: 5.12e-3
    resolutions: [256, 512, 1024, 2048]
    distance: 0.500
  fixed_pitch:
    dx: 5.0e-6
    resolutions: [256, 512, 1024, 2048]
    distance: 0.500

study3_bandlimiting:
  grid:
    nx: 1024
    ny: 1024
    dx: 5.0e-6
    dy: 5.0e-6
    padding: 2
  test_cases:
    - name: "well_sampled_near"
      distance: 0.005
    - name: "intermediate_fresnel"
      distance: 0.500
    - name: "aliasing_prone_far"
      distance: 0.300
    - name: "extreme_far"
      distance: 0.800

benchmarks:
  repeats: 5
  resolutions: [256, 512, 1024, 2048]
