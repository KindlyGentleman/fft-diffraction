[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "europhotonics-diffraction"
version = "0.1.0"
description = "Numerical Accuracy and Sampling Limitations of FFT-Based Scalar Diffraction Models"
authors = [
    { name = "Europhotonics Computational Photonics Research Group" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "scienceplots>=2.1.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.8",
    "pyyaml>=6.0",
    "pytest>=7.0.0",
    "waveprop>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
